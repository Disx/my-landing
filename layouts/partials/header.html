<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="dot" aria-hidden="true"></span>
      <span>office-admin<b>.by</b></span>
    </a>
    <button class="nav-toggle" aria-label="Меню" aria-expanded="false">≡</button>
    <nav class="nav" aria-label="Основная навигация">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
      <a class="btn" href="/#contact">Оставить заявку</a>
    </nav>
  </div>
</header>
  {{ if .IsHome }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Сколько стоит обслуживание?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Абонентское сопровождение — от 500 руб. в месяц. Разовые работы — от 150 руб. за задачу. Точная стоимость зависит от объёма инфраструктуры и согласовывается до начала работ."
        }
      },
      {
        "@type": "Question",
        "name": "Как быстро реагируете на заявки?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "На критичные заявки — в течение часа. Если нужен выезд, специалист приезжает в течение часа по Минску."
        }
      },
      {
        "@type": "Question",
        "name": "Работаете в выходные и нерабочее время?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Да, работаем. Стоимость срочных работ вне графика обсуждается отдельно."
        }
      },
      {
        "@type": "Question",
        "name": "Возьмётесь за одну небольшую задачу?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Да. Минимальный заказ — от 150 руб., характер задачи значения не имеет. Заключать абонентский договор для этого не обязательно."
        }
      },
      {
        "@type": "Question",
        "name": "В каком регионе работаете?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Минск и пригород — с выездом. По остальной Беларуси — удалённо, выезд возможен по договорённости."
        }
      },
      {
        "@type": "Question",
        "name": "Как происходит оплата?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Наличными, картой или безналичным расчётом. Счёт выставляется через приложение «Налог на профессиональный доход», оплата подтверждается электронным чеком с QR-кодом — его можно проверить на сайте налоговой инспекции."
        }
      },
      {
        "@type": "Question",
        "name": "Нужен договор и акт выполненных работ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Да, оформляем по запросу. Образец договора доступен для ознакомления на сайте."
        }
      },
      {
        "@type": "Question",
        "name": "Работаете с организациями или только с частными лицами?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "И с организациями, и с частными лицами. Форма расчёта и пакет документов подбираются под требования клиента."
        }
      }
    ]
  }
  </script>
  {{ end }}
