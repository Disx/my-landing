- code: "[ n8n-automation ]"
  title: "Автоматизация бизнес-процессов"
  text: "Связываем сервисы между собой, автоматизируем обработку заявок, рассылки и отчёты по расписанию. Меньше ручной рутины, меньше ошибок при переносе данных."
  href: "/n8n-automation/"

- code: "[ ai-agents ]"
  title: "Создание и развёртывание AI-агентов"
  text: "Проектируем и разворачиваем AI-агентов под ваши задачи: промты, сценарии обработки, шаблоны. Автоматизируем процессы, на которые уходит время сотрудников."
  href: "/ai-agents/"

- code: "[ ai-integration ]"
  title: "Интеграция AI-агентов с системами"
  text: "Подключаем AI-агентов к вашим базам, сайтам и сервисам — там, где решение принимает ИИ: обработка обращений, ответы клиентам, анализ данных."
  href: "/ai-integration/"

- code: "[ telegram-bots ]"
  title: "Разработка Telegram-ботов"
  text: "Боты для приёма заявок, уведомлений команды, поддержки клиентов, интеграции с таблицами и CRM. Под вашу задачу, а не шаблон."
  href: "/telegram-bots/"

- code: "[ scripts ]"
  title: "Скрипты и цифровые инструменты"
  text: "Разовые задачи под ключ: парсинг данных, автоматические отчёты, небольшие внутренние инструменты для бизнеса — то, на что жалко нанимать отдельного разработчика."
  href: "/scripts-tools/"

- code: "[ web-dev ]"
  title: "Разработка сайтов"
  text: "Сайты-визитки, лендинги и многостраничники: услуги, контакты, форма обратной связи. Быстрая загрузка и готовность к продвижению в поиске."
  href: "/web-development/"

- code: "[ autsorsing ]"
  title: "Абонентское IT-обслуживание"
  text: "Полное сопровождение инфраструктуры по договору: заявки, мониторинг, плановое обслуживание. Предсказуемый бюджет вместо аврального ремонта."
  href: "/business-support/"

- code: "[ servers ]"
  title: "Серверы и виртуализация"
  text: "Установка, настройка и поддержка серверов, гипервизоров и контейнеров. 1С, файловые хранилища, почта, корпоративные сервисы."
  href: "/server-maintenance/"

- code: "[ network ]"
  title: "Сети и Wi-Fi"
  text: "Проектирование и настройка локальных сетей, маршрутизаторов и Wi-Fi, VPN для удалённого доступа сотрудников. Стабильный интернет в офисе."
  href: "/office-wifi-setup/"

- code: "[ backup ]"
  title: "Резервное копирование"
  text: "Настройка автоматических бэкапов и проверка восстановления. Сбой оборудования или шифровальщик не остановят работу компании."
  href: "/data-backup/"

- code: "[ security ]"
  title: "Информационная безопасность"
  text: "Контроль доступа, защита от вирусов и утечек, аудит уязвимостей, политики паролей и обновлений. Снижаем риск простоев и потери данных."
  href: "/information-security/"

- code: "[ workplace ]"
  title: "Поддержка рабочих мест"
  text: "Настройка ПК, оргтехники и программ, помощь сотрудникам. Подбор и закупка оборудования под задачи и бюджет."
  href: "/workplace-support/"
