baseURL = "https://office-admin.by/"
languageCode = "ru-by"
title = "Office-Admin - автоматизация бизнеса и IT-обслуживание в Минске"
enableRobotsTXT = false   # robots.txt отдаём свой из static/
disableKinds = ["taxonomy", "term"]
enableGitInfo = true
enableEmoji = true
timeZone = "Europe/Minsk"

[frontmatter]
  lastmod = [":git", "lastmod", "date", "publishDate"]

[pagination]
  pagerSize = 10

[params]
  # ── Контакты и реквизиты — ЕДИНЫЙ ИСТОЧНИК ПРАВДЫ ──
  businessName = "Office-Admin"
  tagline = "автоматизация бизнеса и IT-обслуживание для офисов"
  description = "Автоматизация бизнес-процессов и IT-обслуживание для малого и среднего бизнеса: обработка заявок, связка сервисов, чат-боты и AI-агенты, а также серверы, сети, рабочие места и информационная безопасность."  
  phoneDisplay = "+375 (29) 640-57-19"
  phoneHref = "375296405719"   # без + — шаблон добавит его сам
  email = "info@office-admin.by"
  # ── Локальное SEO ──
  city = "Минск"
  region = "Беларусь"
  country = "BY"
  showAddress = false
  address = ""
  # ── Прочее ──
  ogImage = "/img/og.png"
  metrikaId = "105088641"      # Яндекс.Метрика

[menu]
  [[menu.main]]
    name = "Услуги"
    url = "/#uslugi"
    weight = 10
  [[menu.main]]
    name = "Как работаем"
    url = "/#process"
    weight = 20
  [[menu.main]]
    name = "Блог"
    url = "/blog/"
    weight = 30
  [[menu.main]]
    name = "Контакты"
    url = "/#contact"
    weight = 40

[outputs]
  home = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true   # разрешить HTML внутри markdown статей

[sitemap]
  changefreq = "weekly"
  priority = 0.6
